[project]
name = "dineon-server"
version = "0.1.0"
description = "This server acts as a bridge between AI models and the iOS app."
authors = [
    {name = "Om Chachad",email = "omchachad12@gmail.com"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "openai (>=2.35.0,<3.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "tiktoken (>=0.12.0,<0.13.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "pytest (>=9.0.3,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
